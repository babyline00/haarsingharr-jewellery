; Upload limits for product images and videos/reels.
; Keep upload_max_filesize >= the largest single file you allow in the app
; (currently 100 MB for videos) and post_max_size large enough for multiple
; files in one request. PHP-FPM / CGI read this file automatically.
upload_max_filesize = 100M
post_max_size = 512M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
